name: Create Versioned Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

# Two of these at once would race on the version bump and push, and the loser
# would tag a version it did not write.
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  version-and-tag:
    name: Bump the version and tag it
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # `npm version` writes package.json and package-lock.json together and
      # refuses on a dirty tree, which is what stops a release carrying
      # somebody's half-finished edit. No tag of its own: the tag is made
      # below, annotated, so `git describe` has something to say.
      - name: Bump the version
        id: version
        run: |
          set -euo pipefail
          version=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Bumped to $version"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "Kyron Lens Studio v${VERSION}"
          git push origin main "v${VERSION}"
          echo "Tagged v${VERSION}."

  # Called, not left to the tag's own trigger. A push made with the default
  # GITHUB_TOKEN does not start another workflow, so the tag above lands
  # silently -- the first run of this workflow tagged v0.1.1 and published
  # nothing.
  release:
    name: Build and publish it
    needs: version-and-tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.version-and-tag.outputs.version }}
