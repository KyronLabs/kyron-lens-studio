name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The format contract, on Linux because it is plain JavaScript with no
  # dependencies and there is nothing Windows-specific about twenty
  # comparisons. The Windows job below is for the app.
  format:
    name: The lens rules still agree with the catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install before these: everything they touch is plain JavaScript
      # with no dependencies, which is what keeps this job a few seconds long
      # and is itself worth guarding -- a format file that quietly grew an
      # import would fail here.
      #
      # `test:format` is the top level of test/ only. The one test that needs
      # three.js lives in test/browser/ and runs in the job below, which
      # installs and vendors anyway.
      - name: Test
        run: npm run test:format

      # The vectors in this repository are a copy. A rule tightened in
      # kyron-lenses and not here means a lens passes the studio, gets
      # published, and silently never appears on anybody's phone -- which is
      # the whole failure the shared spec exists to prevent. So the copy is
      # compared against the source on every run, and a drifted one fails
      # here rather than in a log line on a stranger's handset.
      - name: The vectors have not drifted from kyron-lenses
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/KyronLabs/kyron-lenses/main/format-vectors.json \
            -o /tmp/upstream-vectors.json
          if ! diff -q test/format-vectors.json /tmp/upstream-vectors.json >/dev/null; then
            echo "test/format-vectors.json has drifted from kyron-lenses."
            echo "Run: npm run vectors:refresh -- then fix whatever it breaks."
            diff -u test/format-vectors.json /tmp/upstream-vectors.json | head -40
            exit 1
          fi
          echo "The copy matches the catalogue's own spec."

  # The window, photographed. The studio is a Windows application and this is
  # not Windows -- but Electron's renderer is Chromium, so loading the real
  # page in headless Chromium exercises the real panels, the real editor and
  # the real WebGL face. Everything but the four calls in preload.cjs, which
  # are the ones that open a file dialog.
  #
  # It asserts nothing. It fails when the page throws, which is the class of
  # fault that a unit test of the modules underneath cannot see: a mistyped
  # element id, a landmark index that does not exist in the mesh, a module
  # that will not import.
  window:
    name: The window opens and draws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Copy the two files the renderer serves itself
        run: npm run vendor

      # Everything, now that three.js is where the renderer keeps it. This is
      # where test/browser/ runs.
      - name: Test
        run: npm test

      # The runner image ships Chrome. The tool takes the path in $CHROME so
      # it is the same tool here and on a workstation.
      - name: Photograph it
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          echo "using $CHROME"
          CHROME="$CHROME" node tools/shoot.mjs /tmp/shots

      - uses: actions/upload-artifact@v4
        with:
          name: the-window
          path: /tmp/shots

  # The thing people actually download.
  #
  # `npm run dist` existed and had never run anywhere: electron-builder
  # refuses a version range, and both `electron` and `electron-builder` were
  # ranges, so the script could only ever have failed. They are pinned now,
  # the way `three` already was.
  #
  # On a real Windows runner rather than through wine. Cross-building the
  # installer from Linux needs wine for the step that stamps the icon and the
  # product name into the executable, and an application whose taskbar entry
  # says "Electron" is not the one anybody meant to ship.
  windows:
    name: The Windows application builds
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Not --ignore-scripts here, unlike the job above: electron's own
      # postinstall is what fetches the runtime electron-builder packages.
      - name: Install
        run: npm ci --no-audit --no-fund

      # `--publish never`, inside the script. electron-builder decides to
      # publish on its own when it sees CI, and then fails for want of a
      # token it was never given -- which is how this job passed on the pull
      # request and failed the moment the same commit reached main: a
      # pull_request run does not attempt it and a push run does. The
      # installer had already been built, correctly, both times. Nothing here
      # cuts releases; the artifact below is how the build leaves.
      - name: Build the installer
        run: npm run dist

      # Because "electron-builder exited 0" is not the same as "there is an
      # application here". The two files the renderer loads are gitignored
      # build output, so a build that skipped tools/vendor.mjs produces a
      # studio that installs, launches and shows an empty window -- which is
      # exactly the fault a green tick hides.
      - name: It is a real application
        run: node tools/check-windows-build.mjs dist

      - uses: actions/upload-artifact@v4
        with:
          name: kyron-lens-studio-windows
          path: dist/*.exe
          if-no-files-found: error
